# =============================================================================
# tmux Configuration - Migrated from WezTerm
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi
set -g focus-events on

# Prevent automatic window renaming
set -g allow-rename off
setw -g automatic-rename off

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# -----------------------------------------------------------------------------
# Pane Management
# -----------------------------------------------------------------------------
# Split panes (Ctrl+a \ and Ctrl+a -)
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Close pane without confirmation (Ctrl+a w)
bind w kill-pane

# Zoom toggle (Ctrl+a m)
bind m resize-pane -Z

# Toggle bottom pane (Ctrl+a b)
# Matches WezTerm behavior:
# 1. Single pane -> create bottom split (25%)
# 2. On bottom pane -> go up and zoom
# 3. On top pane -> go down (unzooms automatically)
bind b run-shell "~/.config/tmux/scripts/tmux-toggle-bottom-pane"

# Pane resizing (Ctrl+a H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Equalize panes (Ctrl+a =)
bind = select-layout tiled

# -----------------------------------------------------------------------------
# Window/Tab Management
# -----------------------------------------------------------------------------
# New window (Ctrl+a t)
bind t new-window -c "#{pane_current_path}"

# Navigate windows (Ctrl+a [ and Ctrl+a ])
bind [ previous-window
bind ] next-window

# Close window (Ctrl+a W)
# Worktree windows confirm, then remove the worktree via wt; plain windows just close
bind W if-shell -F "#{@wt_path}" "confirm-before -p 'Remove worktree #{@wt_branch} and close window? (y/n)' \"run-shell '~/.config/tmux/scripts/tmux-worktree-close #{window_id}'\"" "kill-window"

# New worktree window: Claude + shell (Ctrl+a n)
bind n command-prompt -p "New worktree branch:" "run-shell '~/.config/tmux/scripts/tmux-worktree-new \"%1\" \"#{pane_current_path}\"'"

# -----------------------------------------------------------------------------
# Session/Workspace Management
# -----------------------------------------------------------------------------
# Switch to main session (Ctrl+a d)
bind d switch-client -t main

# Switch to/create k8s session (Ctrl+a k)
bind k run-shell "~/.config/tmux/scripts/tmux-k8s-session"

# Session picker with zoxide (Ctrl+a o)
bind o display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/tmux-session-picker"

# Rename session (Ctrl+a R)
bind R command-prompt -p "Rename session:" "rename-session '%%'"

# Navigate sessions (Ctrl+a ( and Ctrl+a ))
bind ( switch-client -p
bind ) switch-client -n

# Last session (Ctrl+a Tab)
bind Tab switch-client -l

# Kill session (Ctrl+a X)
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# -----------------------------------------------------------------------------
# Singleton App Windows
# -----------------------------------------------------------------------------
# Toggle lazygit (Ctrl+a g)
bind g run-shell "~/.config/tmux/scripts/tmux-toggle-app git lazygit"

# Launch Claude Code (Ctrl+a a)
bind a run-shell "~/.config/tmux/scripts/tmux-toggle-app claude claude"

# Cycle through this session's Claude windows (Ctrl+a } / Ctrl+a {, repeatable)
bind -r "}" run-shell "~/.config/tmux/scripts/tmux-claude-cycle next"
bind -r "{" run-shell "~/.config/tmux/scripts/tmux-claude-cycle prev"

# Claude agent picker across all sessions (Ctrl+a A)
bind A display-popup -E -w 90% -h 80% "~/.config/tmux/scripts/tmux-claude-picker"

# Jump to the agent that has waited longest for you (Ctrl+a j)
bind j run-shell "~/.config/tmux/scripts/tmux-claude-picker --next"

# -----------------------------------------------------------------------------
# Copy Mode (vi-style)
# -----------------------------------------------------------------------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# -----------------------------------------------------------------------------
# Plugins & Appearance
# -----------------------------------------------------------------------------
# vim-tmux-navigator bindings (smart pane navigation with Neovim)
# Detects if current pane is running vim/nvim and passes keys through, otherwise navigates tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
# Restore clear screen with prefix + C-l
bind C-l send-keys 'C-l'

# Catppuccin configuration (must be set before loading the plugin)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_current_fill 'number'
# Window tabs get a marker from @claude_wstate (set by ~/.claude/hooks/tmux-claude-state.sh):
#   red ! blocked on you, green ✓ done/waiting for a prompt, yellow ● working.
# The trailing #[fg=#cdd6f4] restores catppuccin's text colour (@thm_fg).
set -g @catppuccin_window_text ' #{?#{==:#{@claude_wstate},blocked},#[fg=#f38ba8]! #[fg=#cdd6f4],#{?#{==:#{@claude_wstate},done},#[fg=#a6e3a1]✓ #[fg=#cdd6f4],#{?#{==:#{@claude_wstate},working},#[fg=#f9e2af]● #[fg=#cdd6f4],}}}#{window_name}'
set -g @catppuccin_window_current_text ' #{?#{==:#{@claude_wstate},blocked},#[fg=#f38ba8]! #[fg=#cdd6f4],#{?#{==:#{@claude_wstate},done},#[fg=#a6e3a1]✓ #[fg=#cdd6f4],#{?#{==:#{@claude_wstate},working},#[fg=#f9e2af]● #[fg=#cdd6f4],}}}#{window_name}'

# Load catppuccin (source conf files directly)
source -F "#{d:current_file}/plugins/catppuccin/tmux/catppuccin_options_tmux.conf"
source -F "#{d:current_file}/plugins/catppuccin/tmux/catppuccin_tmux.conf"

# Status bar layout (must be after catppuccin loads)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
# Gitmux output is placed directly in status-right (not via variable)
# It only shows output when in a git repo
set -g status-right "#(~/.config/tmux/scripts/tmux-claude-summary) #(~/.config/tmux/scripts/tmux-claude-account \"#{session_name}\") #(~/.config/tmux/scripts/tmux-gitmux \"#{pane_current_path}\") #{E:@catppuccin_status_session}"

# Make the status line background transparent (after plugin loads)
set -g status-style "bg=default"

# Left-align prompts and messages (catppuccin centres them, which leaves typed input
# at the left edge, away from the prompt text). fill= blanks the rest of the line;
# without it the window tabs show through behind the input. #1e1e2e is mocha base.
set -g message-style "fg=#94e2d5,bg=default,align=left,fill=#1e1e2e"
set -g message-command-style "fg=#94e2d5,bg=default,align=left,fill=#1e1e2e"

# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
